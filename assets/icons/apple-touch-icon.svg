<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 180 180">
  <defs>
    <linearGradient id="g" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#2563eb"/>
      <stop offset="100%" stop-color="#8b5cf6"/>
    </linearGradient>
  </defs>
  <!-- Apple applies its own rounded mask to apple-touch-icons, so we draw a
       full-bleed solid background and let iOS round the corners. -->
  <rect width="180" height="180" fill="url(#g)"/>
  <text x="50%" y="58%" text-anchor="middle"
        font-family="-apple-system, system-ui, sans-serif"
        font-weight="700" font-size="92" fill="#ffffff">iP</text>
</svg>
